<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poizon Bot</title>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.__tgLoaded && window.__tgLoaded()"></script>
<style>
:root{
  --a1:#7c5cff; --a2:#00d4ff;
  --bg:#0a0b10; --bg2:#12141c; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.08); --text:#f4f5fa; --muted:#8a90a6; --ok:#2fd27c; --bad:#ff5d6c;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font-family:inherit}
.glow{position:fixed;inset:-30% -30% auto;height:60vh;pointer-events:none;z-index:0;filter:blur(40px);opacity:.45;
  background:radial-gradient(40% 50% at 20% 40%,color-mix(in srgb,var(--a1) 50%,transparent),transparent 70%),
             radial-gradient(35% 45% at 85% 25%,color-mix(in srgb,var(--a2) 40%,transparent),transparent 70%)}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 14px 0}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* верх */
.top{display:flex;align-items:center;gap:8px;margin:2px 2px 14px}
.top h1{flex:1;margin:0;font-size:22px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card2);border:1px solid var(--line);padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;cursor:pointer}
.pill b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* калькулятор-герой */
.hero{border-radius:26px;padding:18px;position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.16}
.hero>*{position:relative}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.amount{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.amount span{font-size:30px;font-weight:800;color:var(--muted)}
.amount input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:40px;font-weight:850;letter-spacing:-1px;padding:0}
.amount input::placeholder{color:rgba(255,255,255,.18)}
.result{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.big{font-size:34px;font-weight:850;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.mini{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:8px;margin-top:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.sw{width:38px;height:22px;border-radius:99px;background:var(--card2);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--ok)} .toggle.on .sw:after{left:19px} .toggle.on{color:var(--text)}

h2{font-size:19px;margin:24px 2px 12px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-size:13px;color:var(--muted);font-weight:600;cursor:pointer}

/* карусели и сетка */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 150px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.card .ph img{width:88%;height:88%;object-fit:contain}
.card .tag{position:absolute;left:8px;top:8px;background:#111;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px}
.card .fav{position:absolute;right:6px;top:6px;font-size:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.card .info{padding:9px 10px 11px}
.card .br{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.3px}
.card .nm{font-size:13px;font-weight:600;line-height:1.25;height:2.5em;overflow:hidden;margin:2px 0 6px}
.card .pr{font-weight:800;font-size:15px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.search{width:100%;background:var(--card2);border:1.5px solid transparent;color:var(--text);border-radius:14px;padding:13px 14px;font:inherit;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--a1)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty div{font-size:46px;margin-bottom:8px}

/* шторка товара */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow-y:auto;background:var(--bg2);
  border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#fff;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 100%;aspect-ratio:1;object-fit:contain;scroll-snap-align:center;padding:16px}
.sb{padding:16px}
.sb .br{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.sb h3{margin:4px 0 10px;font-size:20px;letter-spacing:-.3px}
.sizehead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:700}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{border:none;background:none;color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--text);color:#111}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sz{border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;background:var(--card)}
.sz b{display:block;font-size:15px}
.sz small{font-size:10.5px;color:var(--muted)}
.sz.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 18%,transparent)}
.sz{position:relative}
.sz.ord{border-style:dashed}
.sz.ord::after{content:'под заказ';position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:8.5px;font-weight:800;
  background:var(--a2);color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap}
.sizes.var{grid-template-columns:repeat(2,1fr)}
.sizes.var .sz b{font-size:13px;line-height:1.25}
.ordnote{margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--card);border-radius:12px;padding:9px 11px}
.pricebox{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;padding:14px;border-radius:16px;background:var(--card)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:22;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(18,20,28,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:none;gap:10px;max-width:600px;margin:0 auto}
.bar.on{display:flex}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;
  padding:15px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:var(--grad);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{width:auto;padding:12px 16px;font-size:14px}
.f{width:100%;background:var(--card2);border:1.5px solid transparent;color:var(--text);border-radius:14px;padding:13px 14px;font:inherit;outline:none}
.f:focus{border-color:var(--a1)}
textarea.f{min-height:110px;resize:vertical}
.card2{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}

/* корзина */
.ci{display:flex;gap:12px;align-items:center}
.ci .ph{width:62px;height:62px;border-radius:12px;background:#fff;flex:0 0 auto;display:grid;place-items:center;font-size:26px;overflow:hidden}
.ci .ph img{width:90%;height:90%;object-fit:contain}
.ci .t{flex:1;min-width:0}
.ci .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .t small{color:var(--muted);font-size:12.5px}
.ci .x{color:var(--muted);font-size:20px;cursor:pointer;padding:6px}
.lines .ln{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.lines .ln:last-child{border:none}
.lines .k{color:var(--muted)} .free{color:var(--ok);font-weight:650}
.total{display:flex;justify-content:space-between;align-items:flex-end;padding-top:12px}
.badge{display:inline-flex;gap:6px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:650}
.err{color:var(--bad);font-size:13px;margin-top:6px}

/* заказы */
.order-h{display:flex;justify-content:space-between;align-items:center}
.kind{font-size:12px;color:var(--muted);background:var(--card2);padding:5px 10px;border-radius:999px}
.pbar{height:8px;background:var(--card2);border-radius:99px;margin:12px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.tl{margin:12px 0 0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 13px 24px;font-size:14px;color:var(--muted)}
.tl li:before{content:"";position:absolute;left:4px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.tl li:after{content:"";position:absolute;left:9px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.done{color:var(--text)} .tl li.done:before{background:var(--a1);border-color:var(--a1)}
.tl li.now:before{background:var(--a2);border-color:var(--a2);box-shadow:0 0 0 5px color-mix(in srgb,var(--a2) 25%,transparent)}
.tl li small{float:right;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* «ещё» */
.item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;cursor:pointer}
.item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card2)}
.item .t{flex:1;font-weight:650}
.item .go{color:var(--muted);font-size:20px}
.poizon{background:#fff;color:#111;border:none}
.poizon .ic{background:#111;color:#fff}

/* меню */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(10,11,16,.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--muted);font-weight:650;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;position:relative}
nav button span{font-size:21px;filter:grayscale(1);opacity:.65;transition:.2s}
nav button.on{color:var(--text)} nav button.on span{filter:none;opacity:1;transform:translateY(-2px)}
nav .cnt{position:absolute;top:0;left:56%;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:none;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;z-index:40;background:#1d2130;border:1px solid var(--line);
  padding:12px 18px;border-radius:14px;font-size:14px;transition:all .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;height:230px}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="glow"></div>
<main>

<!-- ГЛАВНАЯ -->
<section class="page on" id="home">
  <div class="top">
    <h1 id="title">Poizon Bot</h1>
    <div class="pill" id="sizePill">👟 <b id="mySizeTxt">Мой размер</b></div>
  </div>

  <div class="hero">
    <div class="lbl"><span>💴 Узнать цену любого товара с POIZON</span><span>1¥ = <span id="rateTxt">—</span> ₽</span></div>
    <div class="amount"><span>¥</span><input id="yuan" inputmode="decimal" placeholder="0" autocomplete="off"></div>
    <div class="result">
      <div><div class="mini">Итого с доставкой</div><div class="big" id="yuanTotal">0 ₽</div></div>
      <div class="toggle" id="heroPromo"><span>🎟 Промокод</span><div class="sw"></div></div>
    </div>
    <div class="mini" id="yuanBreak" style="margin-top:6px"></div>
    <div class="row2">
      <input class="f" id="yuanName" placeholder="Что это? (необязательно)" style="flex:1">
      <button class="btn sm" id="yuanAdd">+ В заявку</button>
    </div>
  </div>

  <div id="homeRails"></div>
</section>

<!-- КАТАЛОГ -->
<section class="page" id="catalog">
  <div class="top"><h1>Витрина</h1></div>
  <input class="search" id="q" placeholder="🔍  Найти: Dunk, 530, худи…" autocomplete="off">
  <div class="cats" id="cats"></div>
  <div class="cats" id="brands"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- КОРЗИНА -->
<section class="page" id="cart">
  <div class="top"><h1>Заявка</h1></div>
  <div id="cartList"></div>
  <div id="cartBottom"></div>
</section>

<!-- ЗАКАЗЫ -->
<section class="page" id="orders">
  <div class="top"><h1>Мои заказы</h1></div>
  <div class="row2" style="margin:0 0 14px">
    <input class="f" id="track" inputmode="numeric" placeholder="Трек-номер, например 1147854" style="flex:1">
    <button class="btn sm" id="trackBtn">Найти</button>
  </div>
  <div id="orderList"></div>
</section>

<!-- ЕЩЁ -->
<section class="page" id="more">
  <div class="top"><h1>Помощь</h1></div>
  <div class="item poizon" id="poizonBtn"><div class="ic">🛍</div><div class="t">Открыть POIZON<br><small style="font-weight:500;color:#666">Найдите товар и узнайте цену в ¥</small></div><div class="go">›</div></div>
  <div class="item" id="mgrBtn"><div class="ic">😎</div><div class="t">Написать менеджеру</div><div class="go">›</div></div>
  <div class="item" id="chanBtn"><div class="ic">📢</div><div class="t" id="chanTxt">Наш канал</div><div class="go">›</div></div>
  <h2>Ответы на вопросы</h2>
  <div id="arts"></div>
  <h2>Задать вопрос</h2>
  <textarea class="f" id="question" placeholder="Напишите вопрос — ответ придёт в чат с ботом"></textarea>
  <button class="btn" id="askBtn" style="margin-top:10px">📨 Отправить вопрос</button>
</section>
</main>

<nav>
  <button data-go="home" class="on"><span>🏠</span>Главная</button>
  <button data-go="catalog"><span>🛍</span>Витрина</button>
  <button data-go="cart"><span>🧾</span>Заявка<i class="cnt" id="cartCnt"></i></button>
  <button data-go="orders"><span>📦</span>Заказы</button>
  <button data-go="more"><span>💬</span>Помощь</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="bar" id="sheetBar"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ---------- связь с Telegram (работает и без скрипта telegram.org) ----------
  const W = () => (window.Telegram && window.Telegram.WebApp) || null;
  function postEvent(type, data){
    data = data || {};
    try{
      if(window.TelegramWebviewProxy){ window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data)); return true; }
      if(window.external && 'notify' in window.external){ window.external.notify(JSON.stringify({eventType:type, eventData:data})); return true; }
      if(window.parent !== window){ window.parent.postMessage(JSON.stringify({eventType:type, eventData:data}), '*'); return true; }
    }catch(e){}
    return false;
  }
  const inTelegram = () => !!window.TelegramWebviewProxy || window.parent !== window ||
    (window.external && 'notify' in window.external) || /tgWebApp/.test(location.hash);
  const TG = {
    ready(){ const w=W(); if(w){ try{ w.ready(); w.expand(); w.setHeaderColor('#0a0b10'); w.setBackgroundColor('#0a0b10'); }catch(e){} }
             else { postEvent('web_app_ready'); postEvent('web_app_expand'); } },
    haptic(st){ try{ const w=W(); if(w) w.HapticFeedback.impactOccurred(st); else postEvent('web_app_trigger_haptic_feedback',{type:'impact', impact_style:st}); }catch(e){} },
    openLink(url, iv){ const w=W(); if(w && inTelegram()) return w.openLink(url, iv ? {try_instant_view:true} : undefined);
             if(!postEvent('web_app_open_link',{url, try_instant_view:!!iv})) window.open(url,'_blank'); },
    openTg(url){ const w=W(); if(w && inTelegram()) return w.openTelegramLink(url);
             if(!postEvent('web_app_open_tg_link',{path_full:url.replace(/^https?:\/\/t\.me/,'')})) window.open(url,'_blank'); },
    sendData(str){ if(!inTelegram()) return false; const w=W(); if(w && w.sendData){ w.sendData(str); return true; }
             return postEvent('web_app_data_send',{data:str}); },
    back(show){ const w=W(); try{ if(w) show ? w.BackButton.show() : w.BackButton.hide(); }catch(e){} },
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const haptic = t => TG.haptic(t||'light');
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2600); };
  const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
  const openTg = url => url.indexOf('t.me/')>-1 ? TG.openTg(url) : TG.openLink(url);

  // ---------- данные от бота (?d=...) ----------
  function decode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  const NOW = Date.now()/1000, D = 86400;
  const DEMO = {b:"demo",cu:[],ph:[],cp:5,hx:[],hh:[1],o:[[12,"track",11098,"1147854",NOW-3*D]],r:13.2,f:900,d:1200,pp:25,p:"",m:"manager",cn:"Poizon Bot",cl:"https://t.me/",
    a:[["🙋 Как скачать POIZON?","https://telegra.ph/"],["📦 Доставка и комиссия","https://telegra.ph/"]],
    t:[{n:"1147854",k:"avia",i:2,mi:0,s:[["Принят в обработку",NOW-4*D],["Выкуплен",NOW-3*D],["Отправлен со склада в Китае",NOW-D/2],["Прибыл на склад в Москве",NOW+2*D]]}],
    th:["#7c5cff","#00d4ff","Poizon Bot","Выкуп и доставка оригинальных товаров с POIZON"]};
  let C = DEMO;
  try{ const q = new URLSearchParams(location.search).get('d'); if(q) C = Object.assign({}, DEMO, {cu:[],ph:[],t:[],a:[],hx:[],hh:[],o:[],cp:5}, decode(q)); }catch(e){ console.warn(e); }
  const isDemo = C === DEMO;

  // ---------- хранилище на телефоне ----------
  const KEY = 'pz_' + C.b + '_';
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(KEY+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} },
  };
  let cart = store.get('cart', []);          // [{i, s} | {k:'y', y, n, s}]
  let favs = store.get('favs', []);
  let mySize = store.get('size', '');
  let sizeSys = store.get('sys', 'ru');
  let promoCode = store.get('promo', C.p || '');
  let promoOk = !!C.p;

  // ---------- оформление ----------
  const root = document.documentElement.style;
  root.setProperty('--a1', C.th[0]); root.setProperty('--a2', C.th[1]);
  $('#title').textContent = C.th[2]; document.title = C.th[2];
  $('#rateTxt').textContent = String(C.r).replace('.',',');
  $('#chanTxt').textContent = C.cn ? 'Канал ' + C.cn : 'Наш канал';
  TG.ready();

  // ---------- навигация ----------
  let current = 'home';
  function go(id){
    closeSheet();
    if(id===current) return;
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id===id));
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===id));
    current = id; window.scrollTo(0,0); haptic();
    TG.back(id!=='home');
    if(id==='cart') renderCart();
  }
  document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  function onTgLoaded(){ TG.ready(); try{ W().BackButton.onClick(()=> sheetOpen ? closeSheet() : go('home')); }catch(e){} }
  window.__tgLoaded = onTgLoaded; if(W()) onTgLoaded();

  // ---------- промокод (проверка по отпечатку, сами коды сюда не передаются) ----------
  async function hashCode(code){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(C.b + ':' + code.trim().toUpperCase()));
    return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);
  }
  async function checkPromo(code){
    if(!/^[A-Za-z0-9]{8}$/.test(code)) return false;
    if(C.p && code.toUpperCase()===String(C.p).toUpperCase()) return true;
    try{ return (C.ph||[]).includes(await hashCode(code)); }catch(e){ return false; }
  }

  // ---------- цены ----------
  function totals(lines){  // lines: [цена товара в ₽]
    const n = lines.length, sub = lines.reduce((a,b)=>a+b,0);
    const disc = promoOk ? Math.round(sub*C.pp/100) : 0;
    const fee = promoOk ? 0 : C.f*n, del = promoOk ? 0 : C.d*n;
    return {n, sub, disc, fee, del, total: sub - disc + fee + del};
  }

  // ---------- калькулятор на главной ----------
  const heroPromo = $('#heroPromo');
  function syncPromoUI(){ heroPromo.classList.toggle('on', promoOk); }
  heroPromo.addEventListener('click', ()=>{
    haptic();
    if(promoOk){ promoOk=false; promoCode=''; store.set('promo',''); syncPromoUI(); calcHero(); return; }
    go('cart'); setTimeout(()=>{ const i=$('#promoIn'); if(i) i.focus(); }, 300);
  });
  function calcHero(){
    const y = parseFloat(($('#yuan').value||'').replace(/\s/g,'').replace(',','.')) || 0;
    const item = Math.round(y*C.r);
    const t = totals(y ? [item] : []);
    $('#yuanTotal').textContent = rub(t.total);
    $('#yuanBreak').textContent = y ? `товар ${rub(item)}` + (promoOk ? ` − ${C.pp}% по промокоду · доставка и комиссия 🎁` : ` + комиссия ${rub(C.f)} + доставка ${rub(C.d)}`) : '';
  }
  $('#yuan').addEventListener('input', e=>{ e.target.value=e.target.value.replace(/[^\d.,]/g,''); calcHero(); });
  $('#yuanAdd').addEventListener('click', ()=>{
    const y = parseFloat(($('#yuan').value||'').replace(',','.'));
    if(!y){ toast('Введите цену в юанях'); return; }
    cart.push({k:'y', y, n: $('#yuanName').value.trim().slice(0,60) || 'Товар с POIZON', s: mySize||''});
    saveCart(); haptic('medium'); toast('Добавлено в заявку ✓');
    $('#yuan').value=''; $('#yuanName').value=''; calcHero();
  });

  // ---------- мой размер ----------
  function renderSizePill(){ $('#mySizeTxt').textContent = mySize ? 'Размер ' + mySize : 'Мой размер'; }
  $('#sizePill').addEventListener('click', ()=>{
    const all = ['35','36','36,5','37','37,5','38','38,5','39','40','40,5','41','41,5','42','42,5','43','44','44,5','45','46','47'];
    openSheet(`<div class="sb"><h3>Ваш размер обуви</h3><div class="note">Запомню и буду выбирать его в карточках сам</div>
      <div class="sizehead"><span>Система</span><div class="seg"><button data-sys="ru" class="${sizeSys==='ru'?'on':''}">RU</button><button data-sys="eu" class="${sizeSys==='eu'?'on':''}">EU</button></div></div>
      <div class="sizes">${all.map(s=>`<div class="sz ${s===mySize?'on':''}" data-s="${s}"><b>${s}</b></div>`).join('')}</div></div>`, null);
    const sh = $('#sheet');
    sh.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>{ sizeSys=b.dataset.sys; store.set('sys',sizeSys); sh.querySelectorAll('[data-sys]').forEach(x=>x.classList.toggle('on',x===b)); });
    sh.querySelectorAll('.sz').forEach(el=>el.onclick=()=>{ mySize=el.dataset.s; store.set('size',mySize); renderSizePill(); haptic(); toast('Размер '+mySize+' сохранён'); closeSheet(); });
  });

  // ---------- каталог ----------
  let ITEMS = [], byId = {};
  const img = (u,w) => u ? u + '?x-oss-process=image/resize,w_' + (w||400) + '/format,webp' : '';
  // минимальная цена — по тому, что есть в наличии на POIZON (если есть), иначе по «под заказ»
  const minPrice = it => { const have = it.z.filter(z=>!z[3]); return Math.min(...(have.length?have:it.z).map(z=>z[2])); };
  // техника: варианты «цвет · память» вместо размеров обуви
  const isVariant = z => z.some(x => x[0]!=='Один размер' && !/^[0-9.,/ XSMLxsml\-]+$/.test(x[0]));
  const sizeWord = it => it.v ? 'Вариант' : 'Размер';
  // Каталог общий для всех ботов: в нём цены сайта. Цена этого бота = цена сайта − cp%, округление до 10 ₽.
  function prepare(data){
    const hidden = new Set(C.hx||[]);
    const rank = new Map((C.hh||[]).map((id,n)=>[id,n+1]));   // порядок хитов: ручные, потом авто по рейтингу
    const pct = Number(C.cp)||0;
    return (data.items||[]).filter(it => !hidden.has(it.i)).map(it => {
      // цена: юани POIZON Китай × курс бота (если есть и включено), иначе цена thepoizon.ru − cp%
      const yuan = C.pm === 'cny';
      const z = data.f===2 ? it.z.map(z => [z[0], z[1],
        (yuan && z[4]) ? Math.round(z[4]*Number(C.r)/10)*10 : Math.round(z[2]*(1-pct/100)/10)*10, z[3]?1:0]) : it.z;
      const v = isVariant(z);
      return Object.assign({}, it, {h: rank.get(it.i) || 0, z, v});
    });
  }
  async function loadCatalog(){
    $('#homeRails').innerHTML = '<div class="skel" style="margin-top:22px"></div>';
    // сначала адрес на github.io (рядом с приложением), потом запасной; на каждый не больше 6 секунд
    const urls = [...(C.cu||[])].sort((a,b)=> (a.startsWith('http')?1:0) - (b.startsWith('http')?1:0));
    for(const u of urls){
      try{
        const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 6000);
        const r = await fetch(u, {signal: ctl.signal});
        clearTimeout(tm);
        if(!r.ok) continue;
        const data = await r.json();
        if(data && Array.isArray(data.items) && data.items.length){ ITEMS = prepare(data); break; }
      }catch(e){}
    }
    if(isDemo && !ITEMS.length){ ITEMS = prepare({f:2, items:DEMO_ITEMS}); }
    byId = Object.fromEntries(ITEMS.map(i=>[i.i,i]));
    cart = cart.filter(c => c.k==='y' || byId[c.i]);  // убрать товары, которых больше нет
    saveCart(); renderHome(); renderCatalog();
  }
  function cardHTML(it){
    const fav = favs.includes(it.i);
    return `<div class="card" data-id="${it.i}">
      <div class="ph">${it.h?'<span class="tag">🔥 Хит</span>':''}<span class="fav">${fav?'❤️':''}</span>
        <img loading="lazy" src="${esc(img(it.im[0]))}" alt=""></div>
      <div class="info"><div class="br">${esc(it.b)}</div><div class="nm">${esc(it.t)}</div>
        <div class="pr">${it.z.length>1?'от ':''}${rub(minPrice(it))}</div></div></div>`;
  }
  function bindCards(root){ root.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openItem(+el.dataset.id))); }
  function rail(title, items, onAll){
    if(!items.length) return '';
    const id = 'r' + Math.random().toString(36).slice(2,7);
    setTimeout(()=>{ const a=document.getElementById(id+'a'); if(a&&onAll) a.onclick=onAll; },0);
    return `<h2>${title}<small id="${id}a">Все ›</small></h2><div class="rail">${items.slice(0,12).map(cardHTML).join('')}</div>`;
  }
  function renderHome(){
    const box = $('#homeRails');
    if(!ITEMS.length){ box.innerHTML = '<div class="empty"><div>🛍</div>Витрина скоро появится.<br>А пока — узнайте цену любого товара выше 👆</div>'; return; }
    const hits = ITEMS.filter(i=>i.h).sort((a,b)=>a.h-b.h);
    const fresh = [...ITEMS].sort((a,b)=>b.a-a.a);
    const cheap = ITEMS.filter(i=>minPrice(i) <= 10000).sort((a,b)=>minPrice(a)-minPrice(b));
    const fav = ITEMS.filter(i=>favs.includes(i.i));
    const groups = [...new Set(ITEMS.map(i=>i.g))];
    box.innerHTML =
      rail('❤️ Избранное', fav, ()=>openCatalog({fav:true})) +
      rail('🔥 Хиты', hits, ()=>openCatalog({hit:true})) +
      rail('✨ Новинки', fresh, ()=>openCatalog({})) +
      rail('💸 До 10 000 ₽', cheap, ()=>openCatalog({cheap:true})) +
      `<h2>Категории</h2><div class="cats" style="flex-wrap:wrap">${groups.map(g=>`<div class="chip" data-g="${esc(g)}">${esc(g)}</div>`).join('')}</div>`;
    bindCards(box);
    box.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>openCatalog({g:el.dataset.g}));
  }
  let F = {};
  function openCatalog(f){ F = f||{}; $('#q').value=''; go('catalog'); renderCatalog(); }
  function renderCatalog(){
    const groups = [...new Set(ITEMS.map(i=>i.g))];
    const brands = [...new Set(ITEMS.map(i=>i.b).filter(Boolean))].sort();
    $('#cats').innerHTML = `<div class="chip ${!F.g&&!F.hit&&!F.cheap&&!F.fav?'on':''}" data-g="">Все</div>` +
      groups.map(g=>`<div class="chip ${F.g===g?'on':''}" data-g="${esc(g)}">${esc(g)}</div>`).join('');
    $('#brands').innerHTML = brands.length>1 ? brands.map(b=>`<div class="chip ${F.b===b?'on':''}" data-b="${esc(b)}">${esc(b)}</div>`).join('') : '';
    $('#cats').querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{ F={g:el.dataset.g||undefined, b:F.b}; haptic(); renderCatalog(); });
    $('#brands').querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{ F.b = F.b===el.dataset.b?undefined:el.dataset.b; haptic(); renderCatalog(); });
    const q = $('#q').value.trim().toLowerCase();
    let list = ITEMS.filter(i =>
      (!F.g || i.g===F.g) && (!F.b || i.b===F.b) && (!F.hit || i.h) && (!F.fav || favs.includes(i.i)) &&
      (!F.cheap || minPrice(i)<=10000) && (!q || (i.t+' '+i.b).toLowerCase().includes(q)));
    if(F.hit) list.sort((a,b)=>a.h-b.h);
    $('#grid').innerHTML = list.length ? list.map(cardHTML).join('') :
      `<div class="empty" style="grid-column:span 2"><div>🔍</div>${ITEMS.length?'Ничего не нашлось.':'Витрина пока пустая.'}<br>Любой товар с POIZON можно посчитать на главной.</div>`;
    bindCards($('#grid'));
  }
  $('#q').addEventListener('input', ()=>renderCatalog());

  // ---------- шторка ----------
  let sheetOpen = false;
  function openSheet(html, barHTML){
    $('#sheet').innerHTML = '<div class="grab"></div>' + html;
    $('#sheet').scrollTop = 0;
    $('#sheetBar').innerHTML = barHTML || '';
    $('#sheetBar').classList.toggle('on', !!barHTML);
    $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); sheetOpen = true; TG.back(true);
  }
  function closeSheet(){
    if(!sheetOpen) return;
    $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); $('#sheetBar').classList.remove('on');
    sheetOpen = false; TG.back(current!=='home');
  }
  $('#sheetBg').addEventListener('click', closeSheet);

  function openItem(id){
    const it = byId[id]; if(!it) return;
    haptic();
    const label = z => (sizeSys==='eu' && !it.v) ? z[1] : z[0];
    let sel = it.v ? -1 : it.z.findIndex(z => mySize && (z[0]===mySize || z[1]===mySize));
    if(sel<0 && it.z.length===1) sel = 0;
    let custom = '', askOther = false;   // «другой размер» — привезём под заказ
    const fav = () => favs.includes(id);
    const draw = () => {
      const keep = sheetOpen ? $('#sheet').scrollTop : 0;   // не прыгать наверх при выборе размера
      const z = sel>=0 ? it.z[sel] : (custom ? [custom, custom, Math.max(...it.z.map(x=>x[2])), 1] : null);
      const price = z ? z[2] : minPrice(it);
      const showSizes = it.z.length>1 || it.z[0][0]!=='Один размер';
      const t = totals([price]);
      openSheet(`
        <div class="gallery">${it.im.map(u=>`<img src="${esc(img(u,900))}" alt="">`).join('')}</div>
        <div class="sb">
          <div class="br">${esc(it.b)} · ${esc(it.g)}</div>
          <h3>${esc(it.t)}</h3>
          ${showSizes ? `
          <div class="sizehead"><span>${sizeWord(it)}</span>${it.v?'':`<div class="seg"><button data-sys="ru" class="${sizeSys==='ru'?'on':''}">RU</button><button data-sys="eu" class="${sizeSys==='eu'?'on':''}">EU</button></div>`}</div>
          <div class="sizes ${it.v?'var':''}">${it.z.map((zz,i)=>`<div class="sz ${i===sel?'on':''} ${zz[3]?'ord':''}" data-i="${i}"><b>${esc(label(zz))}</b><small>${zz[3]?'≈ ':''}${rub(zz[2]).replace(' ₽','')}</small></div>`).join('')}
            ${it.v?'':`<div class="sz ${custom?'on':''}" id="otherSz"><b>${custom?esc(custom):'Другой'}</b><small>${custom?'под заказ':'размер'}</small></div>`}</div>
          ${askOther ? `<div style="display:flex;gap:8px;margin-top:10px"><input class="f" id="otherIn" maxlength="12" placeholder="Ваш размер, например 44,5 или XL" value="${esc(custom)}"><button class="btn sm" id="otherOk">OK</button></div>` : ''}
          ${z && z[3] ? `<div class="ordnote">📦 <b>Под заказ.</b> Сейчас этого ${it.v?'варианта':'размера'} нет на POIZON — наши поставщики привезут его с других площадок Китая. Цена примерная, менеджер уточнит.</div>` : ''}` : ''}
          <div class="pricebox">
            <div><div class="mini">${z?'Итого с доставкой':'Выберите '+sizeWord(it).toLowerCase()}</div><div class="big">${z?rub(t.total):'от '+rub(minPrice(it))}</div></div>
            <div class="mini" style="text-align:right">товар ${rub(price)}<br>${promoOk?`−${C.pp}% · доставка 🎁`:`+ доставка и комиссия`}</div>
          </div>
        </div>`,
        `<button class="btn ghost sm" id="favBtn">${fav()?'❤️':'🤍'}</button><button class="btn" id="addBtn">${z?'Добавить в заявку':'Выберите '+sizeWord(it).toLowerCase()}</button>`);
      const sh = $('#sheet');
      sh.scrollTop = keep;
      sh.querySelectorAll('.sz[data-i]').forEach(el=>el.onclick=()=>{ sel=+el.dataset.i; custom=''; haptic(); draw(); });
      const other = $('#otherSz');
      if(other) other.onclick = ()=>{ askOther = true; haptic(); draw(); setTimeout(()=>{ const i=$('#otherIn'); if(i) i.focus(); }, 50); };
      const ok = $('#otherOk');
      if(ok) ok.onclick = ()=>{
        const v = ($('#otherIn').value || '').trim().slice(0,12);
        askOther = false;
        if(v){
          const hit = it.z.findIndex(x => x[0]===v || x[1]===v);
          if(hit>=0){ sel = hit; custom=''; } else { sel = -1; custom = v; }
        }
        haptic(); draw();
      };
      sh.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>{ sizeSys=b.dataset.sys; store.set('sys',sizeSys); draw(); });
      $('#favBtn').onclick = ()=>{ favs = fav() ? favs.filter(x=>x!==id) : [...favs, id]; store.set('favs',favs); haptic(); draw(); renderHome(); };
      $('#addBtn').onclick = ()=>{
        if(sel<0 && !custom){ toast('Выберите ' + sizeWord(it).toLowerCase()); return; }
        cart.push({i:id, s: sel>=0 ? it.z[sel][0] : custom}); saveCart(); haptic('medium');
        closeSheet(); toast('Добавлено в заявку ✓');
      };
    };
    draw();
  }

  // ---------- корзина ----------

    store.set('cart', cart);
    const c = $('#cartCnt'); c.textContent = cart.length; c.style.display = cart.length ? 'grid' : 'none';
  }
  function cartPrice(c){
    if(c.k==='y') return Math.round(c.y*C.r);
    const it = byId[c.i]; if(!it) return 0;
    const z = it.z.find(z=>z[0]===c.s);
    return z ? z[2] : Math.max(...it.z.map(x=>x[2]));   // свой размер под заказ — по верхней цене
  }
  function renderCart(){
    if(!cart.length){
      $('#cartList').innerHTML = '<div class="empty"><div>🧾</div>Заявка пустая.<br>Добавьте товары с витрины или посчитайте любой товар с POIZON на главной.</div>';

      $('#toShop').onclick = ()=>go('catalog'); return;

    $('#cartList').innerHTML = cart.map((c,i)=>{
      const it = c.k==='y' ? null : byId[c.i];
      const ph = it ? `<img src="${esc(img(it.im[0],200))}" alt="">` : '💴';
      const name = it ? it.t : c.n;
      const ord = it && (!it.z.find(z=>z[0]===c.s) || it.z.find(z=>z[0]===c.s)[3]);
      const sub = it ? (c.s==='Один размер' ? '' : `${sizeWord(it)} ${esc(c.s)}`) + (ord ? ' · 📦 под заказ' : '') : `${String(c.y).replace('.',',')} ¥ по курсу ${String(C.r).replace('.',',')}`;
      return `<div class="card2 ci"><div class="ph">${ph}</div><div class="t"><b>${esc(name)}</b><small>${sub}</small><div style="font-weight:800;margin-top:2px">${rub(cartPrice(c))}</div></div><div class="x" data-x="${i}">✕</div></div>`;
    }).join('');

    const t = totals(cart.map(cartPrice));
    $('#cartBottom').innerHTML = `
      <div class="card2">
        <div style="font-weight:700;margin-bottom:8px">🎟 Есть промокод?</div>
        ${promoOk ? `<span class="badge">✓ ${esc(promoCode.toUpperCase())}: −${C.pp}% на товары, доставка и комиссия бесплатно</span>
          <div class="note" style="margin-top:8px;cursor:pointer" id="promoOff">Убрать промокод</div>` :
        `<div class="row2" style="margin:0"><input class="f" id="promoIn" maxlength="8" placeholder="8 букв или цифр" style="flex:1;text-transform:uppercase"><button class="btn sm" id="promoBtn">Применить</button></div><div class="err" id="promoErr"></div>`}
      </div>
      <div class="card2 lines">
        <div class="ln"><span class="k">Товары (${t.n})</span><span>${rub(t.sub)}</span></div>
        ${t.disc?`<div class="ln"><span class="k">Скидка ${C.pp}%</span><span class="free">−${rub(t.disc)}</span></div>`:''}
        <div class="ln"><span class="k">Комиссия</span><span>${promoOk?'<span class="free">бесплатно 🎁</span>':rub(t.fee)}</span></div>
        <div class="ln"><span class="k">Доставка до Москвы</span><span>${promoOk?'<span class="free">бесплатно 🎁</span>':rub(t.del)}</span></div>
        <div class="total"><span class="k">Итого</span><span class="big">${rub(t.total)}</span></div>
      </div>
      <button class="btn" id="checkout">✅ Оформить у менеджера</button>
      <div class="note" style="text-align:center;margin:10px 0 4px">Заявка уйдёт менеджеру — он свяжется с вами в чате</div>`;
    const off = $('#promoOff'); if(off) off.onclick = ()=>{ promoOk=false; promoCode=''; store.set('promo',''); syncPromoUI(); calcHero(); renderCart(); };
    const pb = $('#promoBtn'); if(pb) pb.onclick = async ()=>{
      const code = $('#promoIn').value.trim();
      if(await checkPromo(code)){ promoOk=true; promoCode=code.toUpperCase(); store.set('promo',promoCode); haptic('medium'); toast('🎉 Промокод применён'); syncPromoUI(); calcHero(); renderCart(); }
      else { $('#promoErr').textContent = 'Такого промокода нет ❌'; haptic('heavy'); }
    };
    $('#checkout').onclick = ()=>{
      const it = cart.map(c => c.k==='y' ? {k:'y', y:c.y, n:c.n, s:c.s} : {i:c.i, s:c.s});
      const payload = JSON.stringify({a:'order', pc: promoOk ? promoCode : '', it});
      haptic('medium');
      if(TG.sendData(payload)){ cart = []; saveCart(); }
      else toast('Откройте приложение кнопкой в чате с ботом');
    };
  }

  // ---------- заказы ----------
  function trackCard(t){
    let idx = t.i;
    if(!t.mi){ idx = 0; t.s.forEach((s,i)=>{ if(s[1] <= Date.now()/1000) idx = i; }); }
    const n = t.s.length, pct = Math.round((idx+1)/n*100);
    const date = ts => new Date(ts*1000).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
    return `<div class="card2"><div class="order-h"><b>#${esc(t.n)}</b><span class="kind">${t.k==='avia'?'✈️ Авиа':'🚛 Обычная'}</span></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="note">Сейчас: <b style="color:var(--text)">${esc(t.s[idx][0])}</b> · в Москве ~<b style="color:var(--text)">${date(t.s[n-1][1])}</b></div>
      <ul class="tl">${t.s.map((s,i)=>`<li class="${i<=idx?'done':''} ${i===idx?'now':''}">${esc(s[0])}<small>${i<=idx?'':'~'}${date(s[1])}</small></li>`).join('')}</ul>
      <div class="note">Статусы и даты ориентировочные, по графику доставки</div></div>`;
  }
  const ST = {new:'🆕 Новая', work:'🛠 В работе', paid:'💳 Оплачена', track:'📦 Отправлена', cancel:'❌ Отменена'};
  const dateFull = ts => new Date(ts*1000).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
  const ordersHTML = (C.o||[]).length ? '<h2 style="margin-top:4px">Мои заявки</h2>' + C.o.map(o =>
    `<div class="card2"><div class="order-h"><b>Заявка №${o[0]}</b><span class="kind">${ST[o[1]]||esc(o[1])}</span></div>
     <div class="note" style="margin-top:6px">от ${dateFull(o[4])} · ${rub(o[2])}${o[3]?` · трек <b style="color:var(--text)">${esc(o[3])}</b>`:''}</div></div>`).join('') : '';
  const tracksHTML = (C.t||[]).length ? '<h2>Отслеживание</h2>' + C.t.map(trackCard).join('') : '';
  $('#orderList').innerHTML = (ordersHTML + tracksHTML) ||
    '<div class="empty"><div>📭</div>Здесь появятся ваши заявки и заказы.<br>Трек-номер от менеджера можно ввести выше.</div>';
  $('#trackBtn').onclick = ()=>{
    const n = $('#track').value.trim().replace(/^#/,'');
    if(n.length < 4){ toast('Введите трек-номер'); return; }
    if(!TG.sendData(JSON.stringify({a:'track', n}))) toast('Откройте приложение кнопкой в чате с ботом');
  };

  // ---------- помощь ----------
  $('#poizonBtn').onclick = ()=>{ haptic(); TG.openLink('https://www.thepoizon.ru/'); };
  $('#mgrBtn').onclick = ()=>{ haptic(); openTg('https://t.me/'+C.m); };
  $('#chanBtn').onclick = ()=>{ haptic(); if(C.cl && C.cl.length>14) openTg(C.cl); else toast('Канал не указан'); };
  $('#arts').innerHTML = (C.a||[]).length ? '' : '<div class="note">Статьи скоро появятся</div>';
  (C.a||[]).forEach(a=>{
    const el = document.createElement('div'); el.className='item';
    el.innerHTML = '<div class="ic">📄</div><div class="t"></div><div class="go">›</div>';
    el.querySelector('.t').textContent = a[0];
    el.onclick = ()=>{ haptic(); TG.openLink(a[1], true); };
    $('#arts').appendChild(el);
  });
  $('#askBtn').onclick = ()=>{
    const q = $('#question').value.trim();
    if(q.length < 3){ toast('Напишите вопрос'); return; }
    if(!TG.sendData(JSON.stringify({a:'question', q:q.slice(0,3000)}))) toast('Откройте приложение кнопкой в чате с ботом');
  };

  // ---------- демо-витрина для просмотра в браузере ----------
  const DEMO_ITEMS = [
    {i:1,t:"New Balance 530 White Silver",b:"New Balance",g:"👟 Кроссовки",h:1,a:NOW,im:["https://cdn-img.thepoizon.ru/pro-img/origin-img/20240726/1eed0defcabe44b989217ec6ef6a8431.jpg"],z:[["38","39",7250,1],["39","40",7250],["41","42",7250],["42","43",7200],["43","44",7616]]},
    {i:2,t:"Kawasaki Aurora Backpack",b:"Kawasaki",g:"🎒 Сумки",h:0,a:NOW-9,im:["https://cdn-img.thepoizon.ru/pro-img/origin-img/20250619/333932e74cfd440e9536041cb8737d8f.jpg"],z:[["Один размер","Один размер",4922]]},
    {i:3,t:"Apple iPhone 17 Pro",b:"Apple",g:"📱 Техника",h:0,a:NOW-5,im:["https://cdn-img.thepoizon.ru/pro-img/origin-img/20240726/1eed0defcabe44b989217ec6ef6a8431.jpg"],z:[["Темно-синий · 256 ГБ","Темно-синий · 256 ГБ",126663],["Темно-синий · 512 ГБ","Темно-синий · 512 ГБ",164756],["Серебристый · 1 ТБ","Серебристый · 1 ТБ",203693,1]]},
  ];

  syncPromoUI(); renderSizePill(); saveCart(); calcHero();
  if(C.p){ promoOk = true; promoCode = C.p; syncPromoUI(); }
  else if(promoCode){ checkPromo(promoCode).then(ok=>{ promoOk=ok; if(!ok){ promoCode=''; store.set('promo',''); } syncPromoUI(); calcHero(); }); }
  loadCatalog();
})();
</script>
</body>
</html>
